name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Install build tooling
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Generate application icon
        run: python tools/generate_icon.py

      - name: Build SmartOrganizer.exe
        shell: pwsh
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SmartOrganizer
          --icon assets/SmartOrganizer.ico
          bootstrap.py

      - name: Build Updater.exe
        shell: pwsh
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name updater
          updater_main.py

      - name: Stage portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\config, package\data, package\logs, package\installer | Out-Null
          Copy-Item dist\SmartOrganizer.exe package\SmartOrganizer.exe
          Copy-Item dist\updater.exe package\updater.exe
          Copy-Item main.py package\main.py
          Copy-Item app package\app -Recurse
          Copy-Item core package\core -Recurse
          Copy-Item modules package\modules -Recurse
          Copy-Item config\*.json package\config\
          Copy-Item installer\Install-SmartOrganizer.ps1 package\installer\
          Copy-Item version.json package\version.json
          Copy-Item INSTALL.cmd package\INSTALL.cmd
          Copy-Item README.md package\README.md

      - name: Smoke test installer with Windows PowerShell 5 compatible host
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'Smart-Organizer-Install-Test'
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\package\installer\Install-SmartOrganizer.ps1" -InstallDir $testDir -NoShortcut
          if ($LASTEXITCODE -ne 0) { throw "Installer failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $testDir 'SmartOrganizer.exe'))) { throw 'SmartOrganizer.exe missing after install test' }
          if (-not (Test-Path (Join-Path $testDir 'updater.exe'))) { throw 'updater.exe missing after install test' }
          if (-not (Test-Path (Join-Path $testDir 'data'))) { throw 'data directory missing after install test' }
          if (-not (Test-Path (Join-Path $testDir 'logs'))) { throw 'logs directory missing after install test' }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Organizer-Windows-v0.2.0
          path: package/
          if-no-files-found: error
