name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-organizer-windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Install build tooling
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Generate application icon
        run: python tools/generate_icon.py

      - name: Build SmartOrganizer onedir runtime
        shell: pwsh
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name SmartOrganizer
          --contents-directory _runtime
          --icon assets/SmartOrganizer.ico
          --hidden-import ctypes
          --hidden-import _ctypes
          --hidden-import ctypes.wintypes
          --hidden-import uuid
          bootstrap.py

      - name: Frozen runtime self-test
        shell: pwsh
        run: |
          $exe = "$PWD\dist\SmartOrganizer\SmartOrganizer.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen runtime self-test failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path "$PWD\dist\SmartOrganizer\_runtime")) { throw '_runtime directory missing from onedir build' }

      - name: Build recovery updater
        shell: pwsh
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name updater
          updater_main.py

      - name: Stage runtime and installer packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime-package, package, package\data, package\logs, package\installer | Out-Null

          Copy-Item dist\SmartOrganizer\* runtime-package\ -Recurse -Force
          Copy-Item dist\updater.exe runtime-package\updater.exe
          Copy-Item main.py runtime-package\main.py
          Copy-Item app runtime-package\app -Recurse
          Copy-Item core runtime-package\core -Recurse
          Copy-Item modules runtime-package\modules -Recurse
          Copy-Item config runtime-package\config -Recurse
          Copy-Item version.json runtime-package\version.json
          Copy-Item runtime-manifest.json runtime-package\runtime-manifest.json
          Set-Content -LiteralPath runtime-package\runtime-build.txt -Value "${{ github.sha }}" -Encoding Ascii -NoNewline

          Get-ChildItem -Path runtime-package -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Get-ChildItem -Path runtime-package -Recurse -File -Filter *.pyc | Remove-Item -Force

          Copy-Item runtime-package\* package\ -Recurse -Force
          Copy-Item installer\Install-SmartOrganizer.ps1 package\installer\Install-SmartOrganizer.ps1
          Copy-Item INSTALL.cmd package\INSTALL.cmd
          Copy-Item README.md package\README.md

          Compress-Archive -Path runtime-package\* -DestinationPath dist\SmartOrganizer-runtime.zip -CompressionLevel Optimal -Force

      - name: Smoke test real installed package
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'Smart-Organizer-Install-Test'
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\package\installer\Install-SmartOrganizer.ps1" -InstallDir $testDir -NoShortcut
          if ($LASTEXITCODE -ne 0) { throw "Installer failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $testDir 'SmartOrganizer.exe'))) { throw 'SmartOrganizer.exe missing after install test' }
          if (-not (Test-Path (Join-Path $testDir '_runtime'))) { throw '_runtime missing after install test' }
          if (-not (Test-Path (Join-Path $testDir 'updater.exe'))) { throw 'updater.exe missing after install test' }
          if (-not (Test-Path (Join-Path $testDir 'data'))) { throw 'data directory missing after install test' }
          if (-not (Test-Path (Join-Path $testDir 'logs'))) { throw 'logs directory missing after install test' }
          $process = Start-Process -FilePath (Join-Path $testDir 'SmartOrganizer.exe') -ArgumentList '--self-test' -Wait -PassThru -WorkingDirectory $testDir
          if ($process.ExitCode -ne 0) { throw "Installed runtime self-test failed with exit code $($process.ExitCode)" }
          $gui = Start-Process -FilePath (Join-Path $testDir 'SmartOrganizer.exe') -ArgumentList '--app-self-test' -Wait -PassThru -WorkingDirectory $testDir
          if ($gui.ExitCode -ne 0) { throw "Installed GUI startup self-test failed with exit code $($gui.ExitCode)" }

      - name: Publish atomic runtime update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Atomic onedir runtime bundle. data/ and logs/ are never included or replaced."
          gh release view auto-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload auto-latest "dist/SmartOrganizer-runtime.zip#SmartOrganizer-runtime.zip" "dist/updater.exe#updater.exe" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload runtime assets' }
            gh release edit auto-latest --target "${{ github.sha }}" --title "Smart Organizer Runtime Update" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update rolling release metadata' }
          } else {
            gh release create auto-latest "dist/SmartOrganizer-runtime.zip#SmartOrganizer-runtime.zip" "dist/updater.exe#updater.exe" --target "${{ github.sha }}" --title "Smart Organizer Runtime Update" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create rolling runtime release' }
          }

      - name: Read package version
        id: package_version
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Organizer-Windows-v${{ steps.package_version.outputs.version }}
          path: package/
          if-no-files-found: error
