name: Smart Organizer Shutdown Hotfix Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python compilation
        run: python -m compileall -q main.py core tests
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Construct all GUI screens and close safely
        timeout-minutes: 3
        run: python main.py --app-self-test
