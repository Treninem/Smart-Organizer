name: Smart Organizer PR quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q main.py core tests
      - name: Run tests without changing user files
        run: python -m unittest discover -s tests -v

      - name: Run real Tkinter app screen smoke test
        timeout-minutes: 2
        run: python main.py --app-self-test
